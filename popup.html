<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Lavka Quality Shield</title>
  <style>
    body {
      width: 360px;
      margin: 0;
      padding: 14px;
      background: #18181b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    h2 {
      margin: 0 0 10px;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .stats {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat-box {
      flex: 1;
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 10px;
      padding: 8px;
      text-align: center;
      font-size: 11px;
    }
    .stat-box strong {
      display: block;
      font-size: 16px;
      margin-bottom: 2px;
    }
    .filter-row {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .filter-btn {
      flex: 1;
      background: #27272a;
      color: #d4d4d8;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      padding: 6px;
      font-size: 11px;
      cursor: pointer;
    }
    .filter-btn.active {
      border-color: #fbbf24;
      color: #fbbf24;
      font-weight: 700;
    }
    .list {
      max-height: 280px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .item {
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
    }
    .item-header {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      margin-bottom: 4px;
      gap: 6px;
    }
    .item-header a {
      color: #93c5fd;
      text-decoration: none;
    }
    .item-note {
      color: #a1a1aa;
      font-size: 11px;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .action-btn {
      flex: 1;
      background: #27272a;
      color: #f4f4f5;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      padding: 7px;
      font-size: 11px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>🛡️ Lavka Quality Shield</h2>
  <div class="stats">
    <div class="stat-box"><strong id="count-all">0</strong>Всего</div>
    <div class="stat-box" style="color:#4ade80"><strong id="count-god">0</strong>Годнота</div>
    <div class="stat-box" style="color:#fca5a5"><strong id="count-trash">0</strong>В бане</div>
  </div>
  <div class="filter-row">
    <button class="filter-btn active" data-filter="all">Все</button>
    <button class="filter-btn" data-filter="god">🔥 Топ</button>
    <button class="filter-btn" data-filter="trash">💀 Бан-лист</button>
  </div>
  <div class="list" id="reviews-list"></div>
  <div class="actions">
    <button class="action-btn" id="export-btn">📤 Экспорт JSON</button>
    <button class="action-btn" id="import-btn">📥 Импорт JSON</button>
    <input type="file" id="import-file" accept=".json" style="display:none">
  </div>
  <script src="popup.js"></script>
</body>
</html>
